# One-click deploy: Render dashboard > New > Blueprint > pick this repo. Free plan, demo mode: no keys needed.
# "/" serves the landing page and "/app" the live twin. The free demo keeps its state in SQLite on the service's own
# disk (no Render Postgres, whose free tier is deleted after 30 days); the demo starts fresh on every redeploy or restart.
# To keep state, add a Postgres database and set DATABASE_URL: the app uses it automatically.
# The free plan sleeps after about 15 minutes idle; the first visit after that takes up to a minute to wake.
services:
  - type: web
    name: sentinel-twin-razorpay
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # 120 epochs = the seeded model the landing page's numbers come from (0.09 / 0.63 / 0.61)
      - key: GAT_EPOCHS
        value: "120"
      - key: TWIN_SEED
        value: "3"
      - key: AUTO_TRAFFIC
        value: "1"
      # Cap simulated live orders per process: keeps memory near 400 MB on the free plan's 512 MB
      # (measured: startup training peaks about 350 MB; scenario runs add nothing; 3,000 extra orders plus a retrain about 366 MB).
      - key: AUTO_TRAFFIC_MAX
        value: "3000"
      # Optional. Left empty, reviewers can press every button (reset, apply a policy, confirm a fraud case).
      # Set a value in the Render dashboard to make those admin actions ask for it.
      - key: ADMIN_TOKEN
        sync: false
      # Optional: Postgres instead of SQLite (persists across restarts).
      - key: DATABASE_URL
        sync: false
      # Optional: Razorpay test keys (rzp_test_...) switch the demo gateway to real Razorpay test mode.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: RAZORPAY_FX_RATE
        value: "1"
      # Optional AI keys: without them the agents use their scripted fallbacks.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
