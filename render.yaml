# One-click deploy: Render dashboard > New > Blueprint > pick this repo.
# "/" serves the landing page and "/app" the live demo. Secrets are entered in the Render dashboard (sync: false).
# Payment and mandate state live in Postgres (DATABASE_URL). Render's free Postgres expires 30 days after creation
# (then a 14-day grace period to upgrade before it is deleted), has 1 GB and no backups, and only one free database
# can be active per workspace: fine for a demo, upgrade it for anything real.
databases:
  - name: sentinel-twin-db
    plan: free
    region: singapore

services:
  - type: web
    name: sentinel-twin-razorpay
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GAT_EPOCHS
        value: "80"
      - key: TWIN_SEED
        value: "3"
      - key: AUTO_TRAFFIC
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-twin-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: RAZORPAY_FX_RATE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
